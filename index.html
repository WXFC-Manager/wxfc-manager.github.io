<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WXFC 축구회</title>
<meta name="theme-color" content="#F2F4F6">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://yksmqlinnirkimwimxnh.supabase.co; connect-src 'self' https://yksmqlinnirkimwimxnh.supabase.co; media-src https: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WXFC">
<link rel="icon" href="img/logo.svg">
<style>
:root{--navy:#191F28;--red:#D9141F;--red2:#FFECEC;--green:#0E7A3D;--bg:#F2F4F6;--card:#fff;--ink:#191F28;--ink2:#4E5968;--sub:#6B7684;--line:#F2F4F6;--soft:#F2F4F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Noto Sans KR",sans-serif;letter-spacing:-.2px}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;padding:12px 14px 110px;transition:opacity .2s}
#app.busy{opacity:.5;pointer-events:none;transition:opacity .2s .15s}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:#fff;color:var(--ink);border-radius:22px;padding:22px 20px;margin-bottom:12px}
.hero .ht{color:var(--ink)}.hero .hs,.hero .hl,.hero .hr{color:var(--sub)}
.hs{font-size:13px}.hl{font-size:13px;margin-top:12px}
.ht{font-size:28px;font-weight:800;margin:4px 0;word-break:keep-all;letter-spacing:-.5px}
.hr{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;background:#fff;border-radius:22px;padding:20px 10px;margin-bottom:12px}
.q{text-align:center;font-size:13px;color:var(--ink2);position:relative;display:flex;flex-direction:column;align-items:center;gap:7px}
.q b{width:52px;height:52px;border-radius:16px;background:#FFF3F3;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:400}
.qb{position:absolute;top:-4px;left:calc(50% + 12px);background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 5px}
.fsx{display:none}
#vwrap.fs{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#vwrap.fs #vbox{flex:1;aspect-ratio:auto!important;border-radius:0!important}
#vwrap.fs #vctl{position:absolute;top:0;left:0;right:0;z-index:2;padding:8px 10px 18px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0));transition:opacity .3s}
#vwrap.fs #vctl .row{margin-top:4px!important}
#vwrap.fs #vctl .btn{background:rgba(255,255,255,.18);color:#fff;border:0;padding:7px 4px;font-size:13px}
#vwrap.fs #vctl .btn:not(.b-ghost){background:#fff;color:#111}
#vwrap.fs .fsx{display:block}#vwrap.fs .fsin{display:none}
#vwrap.fs.idle #vctl{opacity:0;pointer-events:none}
@media (orientation:landscape){#vwrap.fs #vctl{display:flex;gap:6px}#vwrap.fs #vctl .row{flex:1;margin-top:0!important}}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:12px}
.ct{font-size:18px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ct .link{font-weight:400}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}.grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--sub);margin-top:2px}
.amt{font-weight:800;font-size:16px;white-space:nowrap}
.tag{font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;font-weight:700}
.t-wait{background:#FFF4DB;color:#8A5A00}.t-ok{background:#EAF1FF;color:#1B5BC7}.t-done{background:#E8F7EE;color:var(--green)}.t-no{background:var(--red2);color:#C8102E}
label{display:block;font-size:14px;color:var(--sub);margin:8px 0 6px;font-weight:600}
input,select,textarea{width:100%;border:0;background:var(--soft);border-radius:14px;padding:14px 15px;font:inherit;margin-bottom:10px;color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px #FFC9CD}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:800;background:var(--red);color:#fff;margin-top:8px;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45}.b-green{background:var(--red)}.b-red{background:#fff;color:#C8102E;box-shadow:inset 0 0 0 1.5px #F5B9BD}.b-ghost{background:#fff;color:var(--ink2)}.card .b-ghost,.sheet .b-ghost,.hero .b-ghost,.modal .b-ghost{background:var(--soft)}.b-ink{background:var(--ink);color:#fff}
.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0;border-radius:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px}
.tab{flex:1 0 auto;text-align:center;padding:9px 16px;border-radius:99px;font-size:14px;color:var(--ink2);white-space:nowrap;background:#fff;font-weight:700}
.tab.on{background:var(--ink);color:#fff}
.fabs{position:fixed;right:max(16px,calc(50% - 264px));bottom:88px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:5}
.fab{background:var(--red);color:#fff;border-radius:99px;padding:14px 20px;font-weight:800;box-shadow:0 8px 20px rgba(217,20,31,.28)}
.fab.n{background:var(--ink);box-shadow:0 8px 20px rgba(25,31,40,.25)}
.empty{text-align:center;color:#8B95A1;padding:36px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--soft)}
.add{width:76px;height:76px;border-radius:12px;border:1.5px dashed #C9CFD6;display:flex;align-items:center;justify-content:center;color:#8B95A1;font-size:26px;position:relative;overflow:hidden}
.add input{position:absolute;inset:0;opacity:0;margin:0;padding:0}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{color:#1B64DA;font-size:14px;white-space:nowrap}.del{color:#C8102E;font-size:13px}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.7;color:var(--ink2)}
.steps{display:flex;align-items:flex-start}.step{flex:1;text-align:center}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#E5E8EB;color:#8B95A1}
.dot.done{background:var(--ink);color:#fff}.dot.now{background:var(--red);color:#fff}.dot.no{background:#C8102E;color:#fff}
.bar{flex:.5;height:2px;background:#E5E8EB;margin-top:16px}
.st{font-size:12px;font-weight:700}.ss{font-size:11px;color:#8B95A1}
.log{font-size:12px;color:var(--sub);padding:7px 0;border-bottom:1px solid var(--line)}.log:last-child{border-bottom:0}
.person{display:flex;align-items:center;gap:12px;padding:9px 0}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;object-fit:cover}
.av.g{background:var(--ink)}
img.av{background:#E5E8EB;display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:var(--soft);color:var(--ink2);border-radius:99px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;margin-left:-6px}
.date{width:54px;text-align:center;background:#FFF3F3;border-radius:14px;padding:7px 0;color:var(--red);flex-shrink:0}
.dd{font-size:19px;font-weight:800;line-height:1.1}.dm{font-size:11px;font-weight:700}
.unread{background:#FFF8F8;margin:0 -20px;padding-left:20px;padding-right:20px}
.hint{font-size:13px;color:#8B95A1;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;border-top:1px solid #EEF0F2;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;width:100%;max-width:560px}
nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:#8B95A1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav a.on{color:var(--ink);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(25,31,40,.92);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:85%;text-align:center}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.logo{display:block;width:72px;height:72px;margin:0 auto 10px}.lt{font-size:24px;font-weight:800;text-align:center;color:var(--ink)}
/* 새 디자인 공통 */
.top{display:flex;align-items:center;gap:10px;padding:4px 4px 14px}
.top img{width:34px;height:34px;border-radius:10px}
.top b{font-size:17px;font-weight:800}
.top .bell{margin-left:auto;position:relative;color:var(--ink2);padding:4px;display:flex}
.top .bell i{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.hello{padding:2px 6px 18px}.hello .s{color:var(--sub);font-size:15px}.hello h1{margin:4px 0 0;font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.6px}.hello em{font-style:normal;color:var(--red)}
.todo{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.todo .n{background:var(--red);border-radius:10px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 6px}
.todo .s{font-size:13px;color:#C9CED6;margin-top:2px}
.pill{font-size:12px;font-weight:800;border-radius:8px;padding:6px 10px;white-space:nowrap;background:var(--red2);color:#C8102E}
.pill.g{background:var(--soft);color:var(--ink2)}.pill.ok{background:#E8F7EE;color:var(--green)}
.avi{border-radius:50%;object-fit:cover;background:#E5E8EB;flex:none;display:block}
/* 사진 고르기 (선거) */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 8px;padding:6px 4px}
.pk{border:0;background:none;padding:0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pk .ph{width:88px;height:88px;border-radius:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--sub);font-weight:800}
.pk .ph img{width:88px;height:88px;object-fit:cover;display:block}
.pk.on .ph::after{content:"";position:absolute;inset:0;background:rgba(217,20,31,.88) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/42% no-repeat}
.pk .nm{font-size:15px;font-weight:700}.pk .sb{font-size:12px;color:var(--sub);margin-top:-4px}
.ptabs{display:flex;justify-content:center;gap:8px;margin:16px 0 8px}
.ptab{border:0;padding:9px 18px;border-radius:99px;background:#fff;color:var(--sub);font:inherit;font-weight:800;font-size:15px;position:relative}
.ptab.on{background:var(--red);color:#fff}
.ptab .k{position:absolute;top:-5px;right:-3px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #EEF0F2;z-index:7;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.dock .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mini{display:flex;padding-left:9px}.mini img,.mini span{width:34px;height:34px;border-radius:50%;border:2px solid #fff;margin-left:-9px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.go{border:0;border-radius:99px;padding:12px 22px;font:inherit;font-weight:800;font-size:16px;background:var(--red);color:#fff}
.go:disabled{background:var(--soft);color:#A0A8B1}
.sw{width:46px;height:28px;border-radius:99px;background:#D5DBE1;position:relative;border:0;flex:none;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ink)}.sw.on::after{left:21px}
.nm2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.nm2 .li{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.nm2 .n{color:var(--sub);font-weight:700;font-size:13px;width:18px;text-align:right;flex:none}
.nm2 .m{margin-left:auto;color:var(--sub);font-size:12px}
/* 사진 맞추기 */
.crop{position:fixed;inset:0;background:#000;z-index:90;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.crop img{position:absolute;left:50%;top:50%;transform-origin:center;max-width:none;will-change:transform}
.crop .mask{position:absolute;inset:0;pointer-events:none}
.crop .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:2.5px dashed rgba(255,255,255,.95);pointer-events:none;transform:translate(-50%,-50%)}
.crop .hd{position:absolute;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:17px;pointer-events:none}
.crop .hd small{display:block;font-weight:400;font-size:13px;color:#C9CED6;margin-top:5px}
.crop .ft{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.crop .zr{display:flex;align-items:center;gap:12px;color:#fff}
.crop .zr input{margin:0;padding:0;background:none;accent-color:#fff}
.crop .bt{display:flex;gap:10px}.crop .bt button{flex:1;border:0;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:800;color:#fff;background:#2B2F36}
.crop .bt button.ok{background:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" style="display:none"><div class="in">
  <a href="#/" data-t="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
  <a href="#/matches" data-t="match"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</a>
  <a href="#/pays" data-t="pay"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>결제</a>
  <a href="#/meets" data-t="meet"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>회의</a>
  <a href="#/me" data-t="me"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>내정보<span class="badge" id="badge" style="display:none"></span></a>
</div></nav>
<div id="toast"></div>
<button id="lang" data-nt style="position:fixed;top:10px;right:10px;z-index:9;border:0;border-radius:99px;padding:6px 12px;font:600 13px/1.2 inherit;background:rgba(255,255,255,.92);color:#191F28;box-shadow:0 2px 8px rgba(0,0,0,.15)"></button>

      const iw = img.naturalWidth, ih = img.naturalHeight, base = D / Math.min(iw, ih);
      let z = 1, tx = 0, ty = 0;
      const draw = () => {
        const sc = base * z, mx = Math.max(0, (iw * sc - D) / 2), my = Math.max(0, (ih * sc - D) / 2);
        tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));

    img.onerror = () => res(file); img.src = url;

    const oa = a, ob = b, oc = c, od = d;
    for(let j = 0; j < 64; j++){
      const r = j >> 4, k = r == 0 ? j : r == 1 ? (5 * j + 1) % 16 : r == 2 ? (3 * j + 5) % 16 : (7 * j) % 16;
      const t = F[r](a, b, c, d, x[i + k], S[r][j % 4], T[j]); a = d; d = c; c = b; b = t;
    }
    a = ad(a, oa); b = ad(b, ob); c = ad(c, oc); d = ad(d, od);
  }
  return [a, b, c, d].map(v => Array.from({ length: 4 }, (_, i) => ((v >> (i * 8)) & 255).toString(16).padStart(2, '0')).join('')).join('');
}

const apiQuiet = (action, d = {}) => rpc('api', { p_token: TOKEN || '', p_action: action, p_d: d }).then(r => r && !r.err ? r : null).catch(() => null);
const vidRow = v => `<a class="it" href="#/video/${v.id}"><div class="grow">▶ ${esc(v.title || v.match_title || '경기 영상')}${v.opponent ? ' vs ' + esc(v.opponent) : ''}<div class="sub">${fdt(v.shot_at)}${v.duration ? ' · ' + esc(v.duration) : ''}</div></div><span class="link">재생 ›</span></a>`;
// 큰 화면: 영상만이 아니라 우리 버튼(10초 이동·속도)까지 함께 전체화면으로. 브라우저가 막으면 화면 꽉 채우기로 대신함
function vidFull(ve){
  const w = $('#vwrap'), fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  let hideT; const wake = () => { w.classList.remove('idle'); clearTimeout(hideT); hideT = setTimeout(() => { if(w.classList.contains('fs') && !ve.paused) w.classList.add('idle') }, 3000) };
  const on = async () => {
    w.classList.add('fs'); wake();
    try { await (w.requestFullscreen ? w.requestFullscreen() : w.webkitRequestFullscreen && w.webkitRequestFullscreen()) } catch(e){}
    try { await screen.orientation.lock('landscape') } catch(e){}
  };
  const off = async () => {
    w.classList.remove('fs', 'idle');
    try { if(fsEl()) await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()) } catch(e){}
    try { screen.orientation.unlock() } catch(e){}
  };
  $('#vfs').onclick = on; $('#vfx').onclick = off;
  w.addEventListener('pointerdown', wake); ve.addEventListener('play', wake); ve.addEventListener('pause', wake);
  // 휴대폰 뒤로 버튼 등으로 전체화면이 풀리면 우리 화면도 원래대로
  const sync = () => { if(!fsEl() && w.isConnected && w.classList.contains('fs') && w.dataset.native) { delete w.dataset.native; off() } else if(fsEl() == w) w.dataset.native = 1 };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
  // 영상 기본 전체화면 버튼으로 들어가도 우리 버튼이 보이는 전체화면으로 바꿈
  const swap = async () => { if(fsEl() === ve){ try { await w.requestFullscreen() } catch(e){ try { await document.exitFullscreen() } catch(e2){} w.classList.add('fs'); wake() } w.classList.add('fs'); wake() } };
  document.addEventListener('fullscreenchange', swap);
  // 영상 자체가 전체화면으로 들어가면(더블탭 등) 우리 전체화면으로 바꿈
  ve.addEventListener('dblclick', e => { e.preventDefault(); w.classList.contains('fs') ? off() : on() });
}

// ───── 경기 일정 · 출석 체크 ─────
// ★ 출석 체크 켜기/끄기: 다른 출석 미니프로그램을 쓰는 동안은 false (숨김). 다시 쓰려면 true 로 바꾸면 됩니다.
const ATTEND = false;
const FORMATS = [['11인제',11],['9인제',9],['8인제',8],['7인제',7],['6인제',6],['5인제 (풋살)',5],['기타',0]];
const WD = ['일','월','화','수','목','금','토'];
const mapUrl = m => (safeUrl(m.map_url) != '#' ? m.map_url : '') || `https://uri.amap.com/search?keyword=${encodeURIComponent((m.venue + ' ' + (m.address||'')).trim())}&src=wxfc&callnative=1`;
const dateBox = s => { const d = new Date(s); return `<div class="date"><div class="dm">${d.getMonth()+1}월 (${WD[d.getDay()]})</div><div class="dd">${d.getDate()}</div></div>` };
const hm = s => { const d = new Date(s); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') };
let CY = null, CMo = 0, CSel = null;
const ZH = () => typeof LANG != 'undefined' && LANG == 'zh';
const WDH = () => ZH() ? ['日','一','二','三','四','五','六'] : WD;
document.addEventListener('click', e => { if(e.target && e.target.id == 'sreq'){ e.target.disabled = true; syncReq().catch(() => { e.target.disabled = false }) } });
function calMove(n){ CMo += n; if(CMo < 0){ CMo = 11; CY-- } if(CMo > 11){ CMo = 0; CY++ } CSel = null; matchesPage() }
async function matchesPage(){
  const r = await api('matches'), up = r.list.filter(m => !m.past), now = new Date();
  if(CY == null){ CY = now.getFullYear(); CMo = now.getMonth() }
  const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`, byDay = {};
  r.list.forEach(m => { const k = key(new Date(m.starts_at)); (byDay[k] = byDay[k] || []).push(m) });
  const pad = new Date(CY, CMo, 1).getDay(), days = new Date(CY, CMo + 1, 0).getDate(), tk = key(now);
  let cells = '<div></div>'.repeat(pad);
  for(let d = 1; d <= days; d++){
    const k = `${CY}-${CMo}-${d}`, n = (byDay[k] || []).length, w = (pad + d - 1) % 7, on = CSel == k;
    cells += `<div onclick="CSel='${k}';matchesPage()" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px;${on ? 'background:var(--navy);color:#fff;' : k == tk ? 'background:#EEF3F8;' : ''}${!on && w == 0 ? 'color:#C62828;' : ''}${!on && w == 6 ? 'color:#1957A6;' : ''}">
      <span style="font-weight:${n ? 800 : 400}">${d}</span><span style="width:6px;height:6px;border-radius:50%;margin-top:3px;background:${n ? (on ? '#fff' : 'var(--green)') : 'transparent'}"></span></div>`;
  }
  const ym = ZH() ? `${CY}年 ${CMo + 1}月` : `${CY}년 ${CMo + 1}월`;
  const sd = CSel ? CSel.split('-') : null, sl = sd ? (ZH() ? `${+sd[1] + 1}月 ${sd[2]}日` : `${+sd[1] + 1}월 ${sd[2]}일`) : '';
  const row = m => `<a class="card" style="display:flex;gap:12px;align-items:center" href="#/match/${m.id}">${dateBox(m.starts_at)}
      <div class="grow"><div style="font-weight:700">${esc(m.title)}${m.opponent ? ' vs ' + esc(m.opponent) : ''}</div>
      <div class="sub">${hm(m.starts_at)} · ${esc(m.venue || '구장 미정')} · ${esc(m.format)}</div>
      ${ATTEND ? `<div class="sub">참석 <b style="color:${m.yes >= m.need ? '#2E7D32' : '#B3261E'}">${m.yes}</b> / ${m.need}명</div>` : ''}</div>
      ${!ATTEND ? '<span class="link">›</span>' : m.mine ? tag(m.mine) : m.past ? '' : '<span class="tag t-wait">체크 ›</span>'}</a>`;
  V(`<div class="card"><div class="ct"><button class="btn b-ghost sm" onclick="calMove(-1)">‹</button><span>📅 ${ym}</span><button class="btn b-ghost sm" onclick="calMove(1)">›</button></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:#7A8694;margin-bottom:4px" data-nt>${WDH().map(w => `<div>${w}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center" data-nt>${cells}</div>
      <div class="hint" style="margin-top:8px">초록 점이 있는 날을 누르면 그날 경기를 볼 수 있습니다.</div></div>
    ${CSel ? `<div class="ct" style="margin:16px 4px 10px" data-nt>${sl}</div>${(byDay[CSel] || []).map(row).join('') || empty('이 날은 경기가 없습니다')}` : ''}
    <div class="ct" style="margin:20px 4px 10px">다가오는 경기</div>${up.map(row).join('') || empty('예정된 경기가 없습니다')}
    <a class="btn b-ghost" style="text-align:center;margin-top:16px" href="#/videos">🎥 경기 영상 보기 ›</a>
    ${isStaff() ? '<div class="fabs"><a class="fab" href="#/match/new">+ 경기 등록</a></div>' : ''}`);
}

    ${card(`⚽ 회원 ${mem.length}명`, `<div class="chips">${mem.map(u => `<span class="chip" style="padding-left:12px">${avi(u.photo, 22)}${esc(u.name)}</span>`).join('')}</div>`)}`);

        <button class="btn b-ghost" id="m5b">🔒 XbotGo 비밀번호 → MD5 변환</button>
        <div id="skout"></div>
        <div class="hint" style="margin-top:8px">키 만들기는 회장·부회장만 할 수 있습니다. 영상 관리 권한은 회장이 '회원 관리'에서 🎥 버튼으로 지정합니다. GitHub 금고 설정 방법은 사용 설명서의 'XbotGo 자동 연동'을 보세요.</div>`)
      + '<a class="btn b-ghost" style="text-align:center" href="#/videos">🎥 경기 영상 보기 ›</a>');
    $('#skb').onclick = async () => {
      if(!await ask('새 동기화 키를 만들까요?', { msg:'이전 키는 더 이상 쓸 수 없게 됩니다.', ok:'만들기' })) return;
      const raw = crypto.getRandomValues(new Uint8Array(24)), key = btoa(String.fromCharCode(...raw)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(key)))].map(b => b.toString(16).padStart(2,'0')).join('');
      await api('syncKey', { hash });
      $('#skout').innerHTML = `<div class="file" style="flex-direction:column;align-items:stretch;gap:8px"><b>WXFC_SYNC_KEY</b><textarea readonly style="min-height:60px;margin:0">${key}</textarea>
        <div class="hint" style="color:#B3261E">이 키는 지금 한 번만 보입니다. 복사해서 GitHub 금고에 넣으세요. (사이트에는 키를 변환한 값만 저장됩니다)</div></div>`;
      $('#skout textarea').select();
    };
    $('#m5b').onclick = () => {
      $('#skout').innerHTML = `<div class="file" style="flex-direction:column;align-items:stretch;gap:8px"><b>XBOTGO_PW_MD5 만들기</b>
        <input id="m5i" type="password" autocomplete="off" placeholder="XbotGo 비밀번호" style="margin:0"><button class="btn sm" id="m5g">변환</button>
        <textarea readonly id="m5o" style="min-height:50px;margin:0" placeholder="결과"></textarea>
        <div class="hint">비밀번호는 이 휴대폰 안에서만 변환되고 어디에도 전송·저장되지 않습니다.</div></div>`;
      $('#m5g').onclick = () => { const p = $('#m5i').value; if(!p) return; $('#m5o').value = md5hex(p).toUpperCase(); $('#m5i').value = ''; $('#m5o').select() };
    };
    return;
  }
  location.replace('#/me');
}
async function mePw(){ const v = await ask('비밀번호 변경', { inputs:[{ ph:'현재 비밀번호', pw:1 }, { ph:'새 비밀번호 (4자 이상)', pw:1 }], ok:'변경' }); if(!v) return;
  await api('setPw', { old:v[0], new:v[1] }); toast('비밀번호 변경 완료') }
async function meCsv(){ const l = (await api('export')).list;
  const rows = [['번호','구분','제목','항목','금액','상태','신청자','사유','신청일','지급일'], ...l.map(p => [p.id,p.type,p.title,p.category,p.amount,p.status,p.applicant,p.reason,fdt(p.created_at),fdt(p.paid_at)])];
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  saveFile(`WXFC_결제내역_${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv') }
async function coachSet(id, on){ await api('coachSet', { id, on }); toast(on ? '코치로 지정했어요' : '코치에서 뺐어요'); route() }
async function photoMenu(){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><div style="font-weight:800;font-size:17px;margin-bottom:4px">프로필 사진</div>
    <button class="btn" data-a="1">새 사진 고르기</button>${ME.photo ? '<button class="btn b-ghost" data-a="2">축구회 로고로 바꾸기</button>' : ''}<button class="btn b-ghost" data-a="0">닫기</button></div>`;
  document.body.appendChild(m);
  const c = await new Promise(r => { m.onclick = e => { const b = e.target.closest('[data-a]'); if(b || e.target === m){ m.remove(); r(b ? b.dataset.a : '0') } } });
  if(c == '0') return;
  const url = c == '1' ? await pickPhoto() : '';
  if(c == '1' && !url) return;
  await api('setPhoto', { url }); ME.photo = url || null; toast('프로필 사진을 바꿨어요'); route();
}
async function setU(id, d){ await api('setUser', { id, ...d }); toast('변경 완료'); route() }
async function delU(id, n){ if(!await ask(`${n}님을 삭제할까요?`, { ok:'삭제', danger:true })) return; await api('delUser', { id }); toast('삭제 완료'); route() }
async function more(id, n, pos){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><div style="font-weight:800;font-size:17px;margin-bottom:4px">${esc(n)}</div>
    <button class="btn b-ghost" data-a="1">✏️ 직책 이름 변경</button><button class="btn b-ghost" data-a="2">🔑 비밀번호 초기화</button>
    <button class="btn b-red" data-a="3">회원 삭제</button><button class="btn b-ghost" data-a="0">닫기</button></div>`;
  document.body.appendChild(m);
  const c = await new Promise(r => { m.onclick = e => { const b = e.target.closest('[data-a]'); if(b || e.target === m){ m.remove(); r(b ? b.dataset.a : '0') } } });
  if(c == '1'){ const p = await ask('직책 이름 (비우면 삭제)', { inputs:[{ ph:'예) 감독, 경기이사', value:pos }], ok:'저장' }); if(p !== null) setU(id, { position:p.trim() }) }
  else if(c == '2'){ const p = await ask('새 임시 비밀번호 (4자 이상)', { inputs:[{ ph:'임시 비밀번호' }], ok:'초기화' });
    if(p){ await setU(id, { pw:p }); ask(`${n}님의 비밀번호가 "${p}"(으)로 바뀌었습니다.`, { msg:'본인에게 알려 주세요.', one:1 }) } }
  else if(c == '3') delU(id, n);
}

// ───── 라우터 ─────
function setBadge(n){ const b = $('#badge'); b.style.display = n ? '' : 'none'; b.textContent = n > 99 ? '99+' : n }
async function loadMe(){ const r = await api('me'); ME = r.me; setBadge(r.unread) }
const ROUTES = [
  [/^#?\/?$/, home, 'home'], [/^#\/pays$/, pays, 'pay'], [/^#\/report$/, reportPage, 'pay'], [/^#\/dues$/, duesPage, 'pay'], [/^#\/pay\/new\/(in|out)$/, payNew, 'pay'], [/^#\/pay\/(\d+)$/, payDetail, 'pay'],
  [/^#\/meets$/, meets, 'meet'], [/^#\/meet\/new$/, meetNew, 'meet'], [/^#\/meet\/(\d+)$/, meetDetail, 'meet'],
  [/^#\/vote\/(\d+)$/, votePage, 'meet'],
  [/^#\/matches$/, matchesPage, 'match'], [/^#\/videos$/, videosPage, 'match'], [/^#\/video\/(\d+)$/, videoPage, 'match'], [/^#\/match\/new$/, () => matchForm(), 'match'],
  [/^#\/match\/edit\/(\d+)$/, matchForm, 'match'], [/^#\/match\/(\d+)$/, matchDetail, 'match'],
  [/^#\/notices$/, () => noticesPage(), 'home'], [/^#\/notices\/new$/, () => noticesPage('new'), 'home'], [/^#\/notices\/edit\/(\d+)$/, id => noticesPage('edit', id), 'home'],
  [/^#\/notice\/(\d+)$/, noticePage, 'home'], [/^#\/signups\/(\d+)$/, signupsPage, 'home'],
  [/^#\/election\/new$/, () => electionNew(), 'home'], [/^#\/election\/(\d+)$/, electionPage, 'home'],
  [/^#\/reqs$/, reqsPage, 'home'], [/^#\/req\/(\d+)$/, reqsPage, 'home'],
  [/^#\/org$/, org, 'home'], [/^#\/me$/, () => mePage(), 'me'], [/^#\/me\/(\w+)$/, mePage, 'me']
];
async function route(){
  if(!TOKEN) return loginView();
  if(loading){ pending = true; return } loading = true;
  const h = location.hash || '#/';
  // 스크롤: 같은 화면 새로고침이면 그대로, 뒤로 가기면 보던 위치, 새 화면이면 맨 위
  if(h === CURH) NAVY = scrollY;
  else { if(CURH) SCR[CURH] = scrollY;
    if(HIST.length > 1 && HIST[HIST.length - 2] === h){ HIST.pop(); NAVY = SCR[h] || 0 } else { HIST.push(h); NAVY = 0 }
    CURH = h; DIRTY = false }
  try {
    const first = !ME;
    if(!ME){ await loadMe(); appToken(TOKEN) }
    $('#nav').style.display = ''; $('#lang').style.display = 'none';
    const [re, fn, t] = ROUTES.find(r => r[0].test(h)) || ROUTES[0]; CURT = t;
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.t == t));
    // 화면을 지우지 않고 흐리게만 → 깜빡임 없음 (처음 열 때만 '불러오는 중…')
    if(first || !$('#app').firstElementChild) $('#app').innerHTML = '<div class="empty">불러오는 중…</div>'; else $('#app').classList.add('busy');
    await fn(...(h.match(re) || []).slice(1));
  } catch(e){ if(TOKEN) $('#app').innerHTML = `<div class="empty">불러오지 못했습니다<br><br><button class="btn b-ghost sm" onclick="route()">다시 시도</button></div>` }
  finally { $('#app').classList.remove('busy'); loading = false; if(pending){ pending = false; route() } }
}
// 작성 중인 내용이 있으면 다른 화면으로 나가기 전에 확인 (아래 메뉴·뒤로·휴대폰 뒤로 버튼 모두)
let DIRTY = false, LASTACT = 0;
document.addEventListener('input', e => { if(e.target.closest && e.target.closest('#app') && e.target.matches('input,textarea')) DIRTY = true }, true);
document.addEventListener('change', e => { LASTACT = Date.now(); if(e.target.closest && e.target.closest('#app') && e.target.type == 'file') DIRTY = true }, true);
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('button')) LASTACT = Date.now() }, true);
let IGNORE = 0;
addEventListener('hashchange', async () => {
  const h = location.hash || '#/';
  if(IGNORE){ IGNORE = 0; return }
  if(DIRTY && TOKEN && CURH && h !== CURH){
    // 일단 작성 화면으로 되돌려 놓고 물어봄
    const wasBack = HIST.length > 1 && HIST[HIST.length - 2] === h;
    IGNORE = 1; wasBack ? history.forward() : history.back();
    if(!await ask('작성 중인 내용이 있어요', { msg:'나가면 입력한 내용이 사라집니다.', ok:'나가기', cancel:'계속 작성', danger:true })) return;
    DIRTY = false; if(wasBack) history.back(); else location.hash = h; return;
  }
  route();
});
setInterval(() => { if(TOKEN && ME && document.visibilityState == 'visible') api('me').then(r => setBadge(r.unread)).catch(()=>{}) }, 60000);
route();
</script>
