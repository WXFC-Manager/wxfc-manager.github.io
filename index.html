<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WXFC 축구회</title>
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WXFC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{--navy:#1B3A5C;--green:#2E7D32;--bg:#F2F5F8;--card:#fff;--ink:#1F2A37;--sub:#7A8694;--line:#EEF1F4;--soft:#F5F7FA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;padding:14px 14px 110px}
.hero{background:linear-gradient(135deg,var(--navy),var(--green));color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:14px;box-shadow:0 8px 20px rgba(27,58,92,.22)}
.hs{font-size:13px;opacity:.85}.hl{font-size:12px;opacity:.8;margin-top:12px}
.ht{font-size:30px;font-weight:800;margin:4px 0;word-break:keep-all}
.hr{display:flex;justify-content:space-between;font-size:12px;opacity:.92;margin-top:6px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.ct{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}.grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--sub);margin-top:2px}
.amt{font-weight:700;font-size:16px;white-space:nowrap}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.t-wait{background:#FFF4CC;color:#8A6D00}.t-ok{background:#DCEBFF;color:#1957A6}.t-done{background:#DFF3E3;color:#2E7D32}.t-no{background:#FDE2E1;color:#B3261E}
label{display:block;font-size:13px;color:#5F6B7A;margin:6px 0 6px}
input,select,textarea{width:100%;border:0;background:var(--soft);border-radius:12px;padding:13px 14px;font:inherit;margin-bottom:10px;color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px #C9D7E6}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--navy);color:#fff;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.5}.b-green{background:var(--green)}.b-red{background:#fff;color:#B3261E;border:1.5px solid #F3B4B0}.b-ghost{background:#EEF3F8;color:var(--navy)}
.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin:0}
.tabs{display:flex;background:#fff;border-radius:99px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;text-align:center;padding:8px 6px;border-radius:99px;font-size:13px;color:#5F6B7A;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;font-weight:700}
.fabs{position:fixed;right:max(16px,calc(50% - 264px));bottom:84px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:5}
.fab{background:var(--green);color:#fff;border-radius:99px;padding:13px 18px;font-weight:700;box-shadow:0 6px 16px rgba(46,125,50,.35)}
.fab.n{background:var(--navy);box-shadow:0 6px 16px rgba(27,58,92,.3)}
.empty{text-align:center;color:#9AA5B1;padding:36px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#EEF1F4}
.add{width:76px;height:76px;border-radius:10px;border:1.5px dashed #C5CED8;display:flex;align-items:center;justify-content:center;color:#9AA5B1;font-size:26px;position:relative;overflow:hidden}
.add input{position:absolute;inset:0;opacity:0;margin:0;padding:0}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:14px}
.fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{color:#1957A6;font-size:13px;white-space:nowrap}.del{color:#B3261E;font-size:13px}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.7}
.steps{display:flex;align-items:flex-start}.step{flex:1;text-align:center}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#E3E8EE;color:#7A8694}
.dot.done{background:var(--green);color:#fff}.dot.now{background:#FFC83D;color:#5A4500}.dot.no{background:#B3261E;color:#fff}
.bar{flex:.5;height:2px;background:#E3E8EE;margin-top:16px}
.st{font-size:12px;font-weight:700}.ss{font-size:11px;color:#9AA5B1}
.log{font-size:12px;color:#5F6B7A;padding:7px 0;border-bottom:1px solid var(--line)}.log:last-child{border-bottom:0}
.person{display:flex;align-items:center;gap:12px;padding:8px 0}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av.g{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#EEF3F8;color:var(--navy);border-radius:99px;padding:5px 12px;font-size:13px}
.date{width:52px;text-align:center;background:#EEF3F8;border-radius:12px;padding:6px 0;color:var(--navy);flex-shrink:0}
.dd{font-size:19px;font-weight:800;line-height:1.1}.dm{font-size:11px}
.unread{background:#F3F8FF;margin:0 -16px;padding-left:16px;padding-right:16px}
.hint{font-size:12px;color:#9AA5B1;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;border-top:1px solid #E6EAEF;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;width:100%;max-width:560px}
nav a{flex:1;text-align:center;padding:8px 0 9px;font-size:11px;color:#7A8694;position:relative}
nav a b{display:block;font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.6}
nav a.on{color:var(--navy);font-weight:700}nav a.on b{filter:none;opacity:1}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:#E53935;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,28,38,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:85%;text-align:center}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.logo{font-size:44px;text-align:center}.lt{font-size:24px;font-weight:800;text-align:center;color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" style="display:none"><div class="in">
  <a href="#/" data-t="home"><b>🏠</b>홈</a>
  <a href="#/matches" data-t="match"><b>⚽</b>경기</a>
  <a href="#/pays" data-t="pay"><b>💳</b>결제</a>
  <a href="#/meets" data-t="meet"><b>🗓</b>회의</a>
  <a href="#/reqs" data-t="req"><b>💬</b>요청</a>
  <a href="#/org" data-t="org"><b>👥</b>조직</a>
  <a href="#/me" data-t="me"><b>🔔</b>내정보<span class="badge" id="badge" style="display:none"></span></a>
</div></nav>
<div id="toast"></div>
<script>
// ───── 설정 (Supabase) ─────
const SB_URL = 'https://yksmqlinnirkimwimxnh.supabase.co';
const SB_KEY = 'sb_publishable_0w85YQNiY0vALbVhtX4ehg_GGp2X2z4';
const CLUB = 'WXFC';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Number(n || 0).toLocaleString();
const LS = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
             set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v) } catch(e){} } };
const CLS = { 참석:'done', 불참:'no', 미정:'wait', 부회장검토:'wait', 회장결재:'wait', 부회장결재:'wait', 지급대기:'ok', 승인:'ok', 지급완료:'done', 반려:'no', 접수:'wait', 처리중:'ok', 완료:'done' };
const STAFF = ['회장','부회장','총무','감독','코치'];
const isStaff = () => ME && STAFF.includes(ME.role);
const tag = s => `<span class="tag t-${CLS[s]||'wait'}">${esc(s)}</span>`;
const fdt = s => { if(!s) return ''; const d = new Date(s); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` };
const card = (t, body, right='') => `<div class="card"><div class="ct"><span>${t}</span>${right}</div>${body}</div>`;
const empty = t => `<div class="empty">${t}</div>`;
const V = h => { $('#app').innerHTML = h; window.scrollTo(0,0) };
// 자동 로그인: 휴대폰에 로그인 정보를 저장 (위챗 브라우저 대비 쿠키에도 저장)
const TK = {
  get(){ return LS.get('wxfc_t') || (document.cookie.match(/(?:^|; )wxfc_t=([^;]+)/) || [])[1] || null },
  set(v){ LS.set('wxfc_t', v); try { document.cookie = 'wxfc_t=' + (v || '') + ';path=/;max-age=' + (v ? 31536000 : 0) + ';SameSite=Lax' } catch(e){} }
};
let TOKEN = TK.get(), ME = null, PAYF = '', loading = false, pending = false;

function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200) }
const HDR = () => ({ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY });

async function rpc(fn, body){
  let r;
  try { r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{...HDR(), 'Content-Type':'application/json'}, body: JSON.stringify(body) }) }
  catch(e){ toast('인터넷 연결을 확인하세요'); throw e }
  if(!r.ok){ toast(r.status >= 500 || r.status === 0 ? '서버가 잠시 응답하지 않습니다. 잠시 후 다시 시도하세요' : '요청 오류 ('+r.status+')'); throw new Error(r.status) }
  return r.json();
}
async function api(action, d = {}){
  const r = await rpc('api', { p_token: TOKEN || '', p_action: action, p_d: d });
  if(r && r.err){ if(r.auth){ logout(true) } toast(r.err); throw new Error(r.err) }
  return r;
}
function logout(silent){ if(!silent && TOKEN) rpc('api',{p_token:TOKEN,p_action:'logout',p_d:{}}).catch(()=>{}); TOKEN = null; ME = null; TK.set(null); location.hash = '#/'; route() }

// ───── 파일 업로드 (사진은 자동 압축) ─────
function shrink(file){
  return new Promise(res => {
    if(!/^image\/(jpe?g|png|webp)$/.test(file.type) || file.size < 400000) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1600, s = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(b ? new File([b], file.name.replace(/\.\w+$/,'') + '.jpg', {type:'image/jpeg'}) : file), 'image/jpeg', .82) };
    img.onerror = () => res(file); img.src = url;
  });
}
async function upload(file){
  file = await shrink(file);
  if(file.size > 20*1024*1024) { toast('파일이 20MB를 넘습니다'); throw new Error('big') }
  const ext = (file.name.split('.').pop() || 'dat').toLowerCase().replace(/[^a-z0-9]/g,'') || 'dat';
  const path = `${new Date().toISOString().slice(0,7)}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const r = await fetch(`${SB_URL}/storage/v1/object/files/${path}`, { method:'POST', headers:{...HDR(), 'Content-Type': file.type || 'application/octet-stream'}, body:file });
  if(!r.ok){ toast('업로드 실패 ('+r.status+')'); throw new Error('up') }
  return { name: file.name, url: `${SB_URL}/storage/v1/object/public/files/${path}`, img: /^image\//.test(file.type) };
}
async function pickUpload(input, arr, after){
  const fs = [...input.files]; input.value = ''; if(!fs.length) return;
  toast('업로드 중…');
  for(const f of fs){ try { arr.push(await upload(f)) } catch(e){ return } }
  toast('업로드 완료'); after();
}
const thumbs = list => (list||[]).filter(f=>f.img!==false).map(f => `<a href="${esc(f.url)}" target="_blank"><img class="thumb" src="${esc(f.url)}" loading="lazy"></a>`).join('');
const fileRow = (f, delAttr) => `<div class="file"><span class="fn">📎 ${esc(f.name)}</span>${delAttr ? `<span class="del" ${delAttr}>삭제</span>` : `<a class="link" href="${esc(f.url)}" target="_blank">열기</a>`}</div>`;

// ───── 위챗 공유 문구 복사 ─────
function share(text){
  const full = `[${CLUB}] ${text}\n${location.href}`;
  const done = () => toast('복사했습니다. 위챗 단톡방에 붙여넣으세요');
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(full).then(done, () => sheetCopy(full));
  else sheetCopy(full);
}
function sheetCopy(t){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><div class="ct">아래 글을 길게 눌러 복사하세요</div><textarea readonly>${esc(t)}</textarea><button class="btn">닫기</button></div>`;
  m.querySelector('button').onclick = () => m.remove(); document.body.appendChild(m);
  const ta = m.querySelector('textarea'); ta.focus(); ta.select();
}

// ───── 로그인 / 가입 ─────
function loginView(mode = 'login'){
  $('#nav').style.display = 'none';
  V(`<div class="login">
    <div class="logo">⚽</div><div class="lt">${CLUB} 축구회</div>
    <div class="sub" style="text-align:center;margin-bottom:18px">회비 · 결제 · 회의 · 회칙</div>
    <div class="tabs"><a class="tab ${mode=='login'?'on':''}" onclick="loginView('login')">로그인</a><a class="tab ${mode=='reg'?'on':''}" onclick="loginView('reg')">가입 신청</a></div>
    <div class="card">
      <label>이름 (실명)</label><input id="ln" autocomplete="username" placeholder="예) 김민수">
      <label>비밀번호 (4자 이상)</label><input id="lp" type="password" autocomplete="${mode=='login'?'current':'new'}-password">
      ${mode=='reg' ? '<label>비밀번호 확인</label><input id="lp2" type="password">' : ''}
      <button class="btn" id="lb">${mode=='login' ? '로그인' : '가입 신청'}</button>
      <div class="hint" style="margin-top:12px">${mode=='login' ? '한 번 로그인하면 로그아웃 전까지 자동으로 로그인됩니다. 다른 기기에서 로그인하면 이전 기기는 로그아웃됩니다.<br>비밀번호를 잊었다면 회장에게 초기화를 요청하세요. <a class="link" href="manual.html">📖 사용 설명서</a>' : '가입 신청 후 회장이 승인하면 로그인할 수 있습니다. 첫 가입자는 자동으로 회장이 됩니다.'}</div>
    </div></div>`);
  $('#lb').onclick = async () => {
    const n = $('#ln').value.trim(), p = $('#lp').value;
    if(mode == 'reg'){
      if(p !== $('#lp2').value) return toast('비밀번호가 서로 다릅니다');
      const r = await rpc('register', { p_name:n, p_pw:p }); if(r.err) return toast(r.err);
      if(!r.approved){ toast('가입 신청 완료! 회장 승인 후 로그인하세요'); return loginView('login') }
    }
    const r = await rpc('login', { p_name:n, p_pw:p }); if(r.err) return toast(r.err);
    TOKEN = r.token; TK.set(TOKEN); route();
  };
}

// ───── 홈 ─────
async function home(){
  const h = await api('home');
  V(`<div class="hero"><div class="hs">${esc(ME.name)} · ${esc(ME.role)}</div>
      <div class="hl">현재 잔액</div><div class="ht">${yen(h.income - h.spend)}</div>
      <div class="hr"><span>총 수입 ${yen(h.income)}</span><span>총 지출 ${yen(h.spend)}</span></div></div>
    ${h.notice ? card('📢 공지', `<div class="txt">${esc(h.notice)}</div>`) : ''}
    ${h.next ? card('⚽ 다음 경기', `<a class="it" href="#/match/${h.next.id}"><div class="grow"><b>${esc(h.next.title)}${h.next.opponent ? ' vs ' + esc(h.next.opponent) : ''}</b>
        <div class="sub">${fdt(h.next.starts_at)} · ${esc(h.next.venue || '구장 미정')} · ${esc(h.next.format)}</div>
        <div class="sub">참석 <b style="color:${h.next.yes >= h.next.need ? '#2E7D32' : '#B3261E'}">${h.next.yes}</b> / 필요 ${h.next.need}명</div></div>
        ${h.next.mine ? tag(h.next.mine) : '<span class="tag t-wait">출석 체크 ›</span>'}</a>`) : ''}
    ${h.polls.length ? card('🗳 진행 중인 투표', h.polls.map(v => `<a class="it" href="#/vote/${v.id}"><div class="grow">${esc(v.title)}${v.deadline ? `<div class="sub">마감 ${fdt(v.deadline)}</div>` : ''}</div>${v.voted ? '<span class="tag t-done">투표 완료</span>' : '<span class="tag t-wait">투표하기 ›</span>'}</a>`).join('')) : ''}
    ${h.todo.length ? card('✅ 내가 처리할 일', h.todo.map(t => `<a class="it" href="#/${t.kind}/${t.id}"><div class="grow">${esc(t.title)}</div>${tag(t.status)}</a>`).join('')) : ''}
    ${card('🗓 최근 확정 회의', h.meets.map(m => `<a class="it" href="#/meet/${m.id}"><div class="grow">${esc(m.title)}<div class="sub">${esc(m.mdate||'')}</div></div><span class="link">보기 ›</span></a>`).join('') || empty('아직 확정된 회의가 없습니다'))}
    ${card('💸 최근 지출', h.recent.map(p => `<a class="it" href="#/pay/${p.id}"><div class="grow">${esc(p.title)}<div class="sub">${esc(p.category)} · ${esc(p.applicant)}</div></div><span class="amt">${yen(p.amount)}</span></a>`).join('') || empty('아직 지출 내역이 없습니다'), '<a class="link" href="#/pays">전체 ›</a>')}`);
}

// ───── 결제 ─────
async function pays(){
  const r = await api('pays', { status: PAYF });
  const F = ['','회장결재','부회장결재','지급대기','지급완료','반려'];
  const canIn = ['회장','총무'].includes(ME.role);
  V(`<div class="tabs">${F.map(f => `<a class="tab ${PAYF==f?'on':''}" onclick="PAYF='${f}';pays()">${f||'전체'}</a>`).join('')}</div>
    ${r.list.length ? `<div class="card">${r.list.map(p => `<a class="it" href="#/pay/${p.id}">
        <div class="grow"><div>${p.type=='수입'?'💰 ':''}${esc(p.title)}</div><div class="sub">${esc(p.applicant)} · ${esc(p.category)} · ${fdt(p.created_at)}</div></div>

function stepsHtml(arr){
  const L = { done:'✓', now:'●', no:'✕', skip:'–', '':'–' }, S = { now:'검토 중', no:'반려', skip:'건너뜀', '':'대기' };
  return arr.map(([t,s,n], i) => `${i ? '<div class="bar"></div>' : ''}<div class="step"><div class="dot ${s}">${L[s]}</div><div class="st">${t}</div><div class="ss">${s=='done' ? esc(n||'완료') : S[s]}</div></div>`).join('');
}
function payLine(p){
  const h = p.history || [], rej = h.find(x => x.act == '반려');
  const who = (r, a = '승인') => (h.find(x => x.role == r && x.act == a) || {}).who;
  const st = (r, now) => rej && rej.role == r ? 'no' : who(r) ? 'done' : p.status == now ? 'now' : '';
  return [['신청','done',p.applicant], ['회장', st('회장','회장결재'), who('회장')],
    ['부회장', p.skip_vice ? 'skip' : st('부회장','부회장결재'), who('부회장')],
    ['총무 지급', p.status == '지급완료' ? 'done' : p.status == '지급대기' ? 'now' : '', who('총무','지급완료')]];
}
function line(m){
  const h = m.history || [], rej = h.find(x => x.act == '반려');
  const st = r => rej && rej.role == r ? 'no' : h.some(x => x.role == r && x.act == '승인') ? 'done'
    : (m.status == '부회장검토' && r == '부회장') || (m.status == '회장결재' && r == '회장') ? 'now' : '';
  return [['작성','done',m.by_name], ['부회장', m.skip_vice ? 'skip' : st('부회장')], ['회장', st('회장')]];
}

  [/^#\/matches$/, matchesPage, 'match'], [/^#\/match\/new$/, () => matchForm(), 'match'],
  [/^#\/match\/edit\/(\d+)$/, matchForm, 'match'], [/^#\/match\/(\d+)$/, matchDetail, 'match'],
  [/^#\/reqs$/, reqsPage, 'req'], [/^#\/req\/(\d+)$/, reqsPage, 'req'],
  [/^#\/org$/, org, 'org'], [/^#\/me$/, mePage, 'me']
];
async function route(){
  if(!TOKEN) return loginView();
  if(loading){ pending = true; return } loading = true;
  try {
    if(!ME) await loadMe();
    $('#nav').style.display = '';
    const h = location.hash || '#/';
    const [re, fn, t] = ROUTES.find(r => r[0].test(h)) || ROUTES[0];
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.t == t));
    $('#app').innerHTML = '<div class="empty">불러오는 중…</div>';
    await fn(...(h.match(re) || []).slice(1));
  } catch(e){ if(TOKEN) $('#app').innerHTML = `<div class="empty">불러오지 못했습니다<br><br><button class="btn b-ghost sm" onclick="route()">다시 시도</button></div>` }
  finally { loading = false; if(pending){ pending = false; route() } }
}
addEventListener('hashchange', route);
setInterval(() => { if(TOKEN && ME && document.visibilityState == 'visible') api('me').then(r => setBadge(r.unread)).catch(()=>{}) }, 60000);
route();
</script>
</body>
</html>
