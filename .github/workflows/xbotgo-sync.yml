name: xbotgo-sync
on:
  schedule:
    - cron: '17 */8 * * *'   # 8시간마다 전체 가져오기 (재생 주소가 24시간 유효하므로 넉넉히 갱신)
    - cron: '*/10 * * * *'   # 10분마다: 사이트의 [새 영상 가져오기] 요청이 있을 때만 실행
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: xbotgo-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: XbotGo 영상 → 사이트 경기 일정
        env:
          XBOTGO_PHONE: ${{ secrets.XBOTGO_PHONE }}
          XBOTGO_PW_MD5: ${{ secrets.XBOTGO_PW_MD5 }}
          XBOTGO_PASSWORD: ${{ secrets.XBOTGO_PASSWORD }}
          WXFC_SYNC_KEY: ${{ secrets.WXFC_SYNC_KEY }}
          SYNC_MODE: ${{ github.event.schedule == '*/10 * * * *' && 'check' || 'full' }}
        run: node scripts/xbotgo-sync.mjs
      - name: 상태 기록 (숫자·오류 요약만)
        if: always()
        run: |
          git config user.name sync-bot
          git config user.email sync-bot@users.noreply.github.com
          git add sync/status.json
          git commit -m "XbotGo 동기화 상태" || exit 0
          git pull --rebase origin main && git push origin HEAD:main || true
