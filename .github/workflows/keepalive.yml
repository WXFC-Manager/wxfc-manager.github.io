name: keepalive
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping supabase
        run: |
          curl -fsS -X POST "https://yksmqlinnirkimwimxnh.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_0w85YQNiY0vALbVhtX4ehg_GGp2X2z4" \
            -H "Authorization: Bearer sb_publishable_0w85YQNiY0vALbVhtX4ehg_GGp2X2z4" \
            -H "Content-Type: application/json" -d '{}'
      - name: keep repo active
        run: |
          date -u > .keepalive
          git config user.name keepalive
          git config user.email keepalive@users.noreply.github.com
          git add .keepalive
          git commit -m "keepalive" && git push || true
